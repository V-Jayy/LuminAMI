name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected a version tag.' }
          ./scripts/package.ps1 -Version $Matches[1]
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = "docs/RELEASE-$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG ./dist/*.zip ./dist/SHA256SUMS.txt --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG ./dist/*.zip ./dist/SHA256SUMS.txt --repo $env:GH_REPO --verify-tag --title "LuminAMI $env:RELEASE_TAG" --notes-file $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
